{{- /* One HorizontalPodAutoscaler per version, when autoscaling is on. */}}
{{- range $version, $cfg := .Values.versions }}
{{- if $.Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "helloworld.fullname" $ }}-{{ $version }}
  labels:
    {{- include "helloworld.labels" $ | nindent 4 }}
    version: {{ $version }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "helloworld.fullname" $ }}-{{ $version }}
  minReplicas: {{ $.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.autoscaling.maxReplicas }}
  metrics:
    # Percentage of the CPU *request*, not of a core: with requests.cpu 300m
    # a target of 75 means "scale out above 225m per pod".
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
