{{- if .Values.authorizationPolicy.enabled }}
# Who may call hello-alpha (both versions). ztunnel checks the caller's mesh
# identity on every new connection; callers no rule matches are refused.
# A principal is the caller's SPIFFE identity without "spiffe://", e.g.
# "cluster.local/ns/<namespace>/sa/<serviceaccount>".
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "helloworld.fullname" . }}
  labels:
    {{- include "helloworld.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ include "helloworld.fullname" . }}
  action: ALLOW
  rules:
    - from:
      - source:
          principals:
            - "cluster.local/ns/infra-gw/sa/public-istio"
{{- end }}
