{{- if .Values.authorizationPolicy.enabled }}
{{- if not .Values.authorizationPolicy.principals }}
{{- fail "authorizationPolicy.enabled=true requires a non-empty authorizationPolicy.principals list: an ALLOW policy that selects these pods with no matching rule refuses EVERY caller." }}
{{- end }}
# Who may call hello-alpha (both versions). ztunnel checks the caller's mesh
# identity on every new connection; callers no rule matches are refused.
# A principal is the caller's SPIFFE identity without "spiffe://", e.g.
# "cluster.local/ns/<namespace>/sa/<serviceaccount>".
#
# The list is values-driven because the right answer depends on the traffic
# path: with a waypoint, callers arrive wearing the WAYPOINT's identity;
# without one, they arrive as themselves.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "helloworld.fullname" . }}
  labels:
    {{- include "helloworld.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ include "helloworld.fullname" . }}
  action: ALLOW
  rules:
    - from:
      - source:
          principals:
            {{- range .Values.authorizationPolicy.principals }}
            - {{ tpl . $ | quote }}
            {{- end }}
{{- end }}
