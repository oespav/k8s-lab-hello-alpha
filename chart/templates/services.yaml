{{- /* One Service per version, so the HTTPRoute can weight each separately. */}}
{{- range $version, $cfg := .Values.versions }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helloworld.fullname" $ }}-{{ $version }}
  labels:
    {{- include "helloworld.labels" $ | nindent 4 }}
    version: {{ $version }}
    {{- if .Values.ingressUseWaypoint.enabled }}
    istio.io/ingress-use-waypoint: "true"
    {{- end }}
spec:
  selector:
    {{- include "helloworld.selectorLabels" (dict "root" $ "version" $version) | nindent 4 }}
  ports:
    - name: http
      port: {{ $.Values.containerPort }}
      targetPort: http
{{- end }}
---
# Umbrella Service covering every version: the address east-west callers
# use. Its traffic goes through the namespace waypoint, where the GAMMA
# HTTPRoute (meshroute.yaml) splits requests across versions by weight.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helloworld.fullname" . }}
  labels:
    {{- include "helloworld.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app: {{ include "helloworld.fullname" . }}
  ports:
    - name: http
      port: {{ .Values.containerPort }}
      targetPort: http
