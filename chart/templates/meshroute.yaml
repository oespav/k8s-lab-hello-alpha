{{- if .Values.meshRoute.enabled }}
{{- $fullname := include "helloworld.fullname" . }}
{{- $canary := .Values.route.canaryHeader }}
# GAMMA route: east-west traffic to the umbrella Service gets the same
# canary header and weights as users get at the gateway. parentRef is a
# Service (not a Gateway), so the namespace's waypoint implements it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}-mesh
  labels:
    {{- include "helloworld.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: {{ $fullname }}
      port: {{ .Values.containerPort }}
  rules:
    {{- if $canary.enabled }}
    - matches:
        - headers:
            - name: {{ $canary.name }}
              value: {{ $canary.value | quote }}
      backendRefs:
        - name: {{ $fullname }}-{{ $canary.version }}
          port: {{ .Values.containerPort }}
    {{- end }}
    - backendRefs:
        {{- range $version, $cfg := .Values.versions }}
        - name: {{ $fullname }}-{{ $version }}
          port: {{ $.Values.containerPort }}
          weight: {{ $cfg.weight | default 0 }}
        {{- end }}
{{- end }}
