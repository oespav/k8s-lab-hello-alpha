# Chart defaults. Per-environment overrides live in ../environments/<env>/values.yaml,
# which is what Argo CD deploys (see the tenant file in platform-infra).

# Each key is a version. Helm creates one Deployment and one Service per
# entry, and the HTTPRoute splits traffic between them by weight.
# Using a map (not a list) lets you override one field on the command line:
#   --set versions.v2.weight=50
versions:
  v1:
    image: docker.io/istio/examples-helloworld-v1:1.0
    replicas: 1
    weight: 80
  v2:
    image: docker.io/istio/examples-helloworld-v2:1.0
    replicas: 1
    weight: 20

imagePullPolicy: IfNotPresent
containerPort: 5000

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

# The shared Gateway this app's HTTPRoute attaches to. Gateways are owned
# by the platform team (platform-infra); this chart never creates one.
# Your namespace must carry the gateway's access label (set by the platform
# team in your tenant file) or the route is rejected: NotAllowedByListeners.
gateway:
  name: public
  namespace: infra-gw
  sectionName: https     # the TLS listener; the http listener only redirects

route:
  # Must fall inside the gateway's hostname (public: *.apps.localhost,
  # internal: *.internal.localhost).
  hostnames:
    - hello.apps.localhost
  pathPrefix: /hello
  # Requests carrying this header skip the weighted split and always go
  # to the given version. Handy for testing a release before shifting traffic.
  canaryHeader:
    enabled: true
    name: x-canary
    value: "true"
    version: v2

# Who may call this app: an Istio AuthorizationPolicy, enforced by ztunnel
# at L4 (caller identity + port; no paths or methods without a waypoint).
# Off by default: once an ALLOW policy selects the pods, every caller that
# no rule matches is refused.
authorizationPolicy:
  enabled: false
  # SPIFFE identities allowed to open a connection, without the "spiffe://"
  # prefix. Entries are templated, so "{{ .Release.Namespace }}" works.
  # Empty + enabled is a deploy-time error: it would deny every caller.
  principals: []

# East-west routing (GAMMA): an HTTPRoute on the umbrella Service, implemented
# by the namespace waypoint. Needs a waypoint (istio.io/use-waypoint).
meshRoute:
  enabled: false

# L7 policy enforced by the namespace waypoint: which caller may use which
# HTTP methods/paths. Needs a waypoint. Off by default; an ALLOW policy with
# no matching rule answers every request through the waypoint with 403.
authorizationPolicyL7:
  enabled: false

ingressUseWaypoint:
  enabled: false

# Horizontal autoscaling per version. Needs metrics-server (the platform
# installs it). When on, the chart stops setting replicas so the HPA owns it.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  # Percentage of resources.requests.cpu, so that request must be realistic:
  # too small a request makes every pod look overloaded immediately.
  targetCPUUtilizationPercentage: 75
