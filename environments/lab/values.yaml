# hello-alpha in the lab cluster. Team Alpha owns this file:
# change weights here, commit, push - Argo CD rolls it out.
versions:
  v1:
    image: docker.io/istio/examples-helloworld-v1:1.0
    replicas: 1
    weight: 80
  v2:
    image: docker.io/istio/examples-helloworld-v2:1.0
    replicas: 1
    weight: 20

gateway:
  name: public
  namespace: infra-gw
  sectionName: https

route:
  hostnames:
    - hello.apps.localhost
  pathPrefix: /hello
  canaryHeader:
    enabled: true
    name: x-canary
    value: "true"
    version: v2

# Autoscale on CPU. requests.cpu is raised from the chart default (50m) so the
# 75 % target means ~225m per pod: the app tops out near one core, so a busy
# pod sits well above the target and the HPA adds replicas.
resources:
  requests:
    cpu: 300m
    memory: 64Mi
  limits:
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75
